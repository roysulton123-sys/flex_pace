name: Keep Supabase Alive

on:
  schedule:
    # Berjalan setiap 4 hari sekali pada jam 00:00 UTC
    - cron: '0 0 */4 * *'
  # Memungkinkan Anda menjalankan workflow ini secara manual via tab Actions
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
